clusterName: talos-demo
k8sVersion: 1.37.1
image: factory.talos.dev/metal-installer/6adc7e7fba27948460e2231e5272e88b85159da3f3db980551976bf9898ff64b:v1.14.4
installerMirror: ""  # зеркало для installer-образа (factory.talos.dev), например https://registry.example.com:5000
iface: ens18
cpCount: 3
workerCount: 3
gateway: 192.168.1.1
netmask: 24
dns1: 8.8.8.8
dns2: 8.8.4.4
ntp1: 1.ru.pool.ntp.org
ntp2: 2.ru.pool.ntp.org
ntp3: 3.ru.pool.ntp.org
useVIP: true
vipIP: 192.168.1.10
useExtBalancer: false
extBalancerIP: "192.168.1.8,192.168.1.9"
disk: /dev/sda
useDRBD: true
useZFS: false
useSPL: false
useVFIOPCI: false
useVFIOIOMMU: false
useOVS: false
useMirrors: true
# прокси для нод (http_proxy и https_proxy); no_proxy с подсетями кластера, VIP и .svc добавляется автоматически
# httpProxy: http://proxy.example.com:3128
# дополнительные исключения no_proxy через запятую
# noProxy: "registry.example.com,10.0.0.0/8"
# дополнительные записи /etc/hosts на нодах (применяются после apply-config)
# ISO собран с image cache (--image-cache, Talos >= 1.14): кэш копируется на диск при установке
# imageCache: true
# imageCacheSize: 2GB
# extraHosts:
#   - ip: 10.0.0.5
#     hostnames:
#       - registry.example.com
#       - registry
useMaxPods: false
useSpegel: false
cpIPs:
  - 192.168.1.11
  - 192.168.1.12
  - 192.168.1.13
workerIPs:
  - 192.168.1.14
  - 192.168.1.15
  - 192.168.1.16
